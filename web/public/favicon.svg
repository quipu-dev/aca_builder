<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- App 图标标准 Squircle 底板 (科技深蓝黑) -->
  <rect width="512" height="512" rx="115" fill="#0A0E1A" />

  <g transform="translate(256, 256)">
    <!-- 4 个正交粗构件 (厚度高达 44px，极小尺寸下仍然非常清晰) -->
    <!-- D3: 顶部规则构件 (品蓝) -->
    <path d="M -76 -140 L 76 -140 L 76 -96 L -32 -96 L -32 0 L -76 0 Z" fill="#6366F1" />

    <!-- D2: 右侧程序构件 (翡翠绿) -->
    <path d="M 140 -76 L 140 76 L 96 76 L 96 -32 L 0 -32 L 0 -76 Z" fill="#10B981" />

    <!-- D4: 底部契约构件 (青蓝) -->
    <path d="M 76 140 L -76 140 L -76 96 L 32 96 L 32 0 L 76 0 Z" fill="#06B6D4" />

    <!-- D1: 左侧陈述构件 (亮白/浅灰，打破平衡产生视觉动势) -->
    <path d="M -140 76 L -140 -76 L -96 -76 L -96 32 L 0 32 L 0 76 Z" fill="#F8FAFC" />

    <!-- 中央 Kernel 核心 (单例基石 - 强对比纯金实心方块) -->
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#F59E0B" />
  </g>
</svg>